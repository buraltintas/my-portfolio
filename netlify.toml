[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

# Projects that were removed, sent to what replaced them. Add one here
# whenever a project's slug is removed or renamed.
[[redirects]]
  from = "/projects/credit-calculator"
  to = "/projects/banker"
  status = 301

[[redirects]]
  from = "/projects/grocery-list"
  to = "/projects/marketmatik"
  status = 301

