# The Netlify subdomain serves the same site; send it to the real domain.
[[redirects]]
  from = "https://burak-altintas.netlify.app/*"
  to = "https://burak-altintas.com/:splat"
  status = 301
  force = true

# Hashed build files never change; images keep their names, so a week.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
